<!DOCTYPE html>
<html lang="en">
<!-- REBUILT PORTFOLIO - Malav Mistry -->
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Malav Mistry — Software Developer Portfolio">
  <meta name="author" content="Malav Mistry">

  <title>Malav Mistry | Portfolio</title>

  <!-- Google Fonts: Orbitron (display) + Share Tech Mono (code) + Rajdhani (body) -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- ██ ALL STYLES ██ -->
  <style>
    /* ======== RESET ======== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan:   #00f5ff;
      --green:  #39ff14;
      --purple: #b400ff;
      --blue:   #4169e1;
      --bg:     #020818;
      --card-bg: rgba(4, 16, 40, 0.95);
      --text:   #c8d6f0;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      cursor: none;
    }

    /* ======== CANVAS ======== */
    #smoke-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }

    /* ======== GRID BACKGROUND ======== */
    .grid-bg {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(0,245,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 1; pointer-events: none;
    }

    /* ======== SCANLINES ======== */
    .scanlines {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px
      );
      pointer-events: none; z-index: 2;
    }

    /* ======== CORNER ACCENTS ======== */
    .corner { position: fixed; width: 44px; height: 44px; pointer-events: none; z-index: 50; }
    .corner-tl { top:18px; left:18px;   border-top:2px solid rgba(0,245,255,0.40); border-left:2px solid rgba(0,245,255,0.40); }
    .corner-tr { top:18px; right:18px;  border-top:2px solid rgba(0,245,255,0.40); border-right:2px solid rgba(0,245,255,0.40); }
    .corner-bl { bottom:18px; left:18px;  border-bottom:2px solid rgba(0,245,255,0.40); border-left:2px solid rgba(0,245,255,0.40); }
    .corner-br { bottom:18px; right:18px; border-bottom:2px solid rgba(0,245,255,0.40); border-right:2px solid rgba(0,245,255,0.40); }

    /* ======== SYSTEM LABELS ======== */
    .sys-label {
      position: fixed; bottom: 0.75rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem; letter-spacing: 0.18em;
      color: rgba(0,245,255,0.24); pointer-events: none; z-index: 50;
    }
    .sys-label-left  { left:1.4rem; }
    .sys-label-right { right:1.4rem; }

    /* ======== CUSTOM CURSOR ======== */
    .cursor {
      position: fixed; width: 10px; height: 10px;
      background: var(--cyan); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 8px var(--cyan), 0 0 20px rgba(0,245,255,0.5);
      transition: transform 0.12s ease, width 0.2s, height 0.2s;
    }
    .cursor-ring {
      position: fixed; width: 34px; height: 34px;
      border: 1px solid rgba(0,245,255,0.5);
      border-radius: 50%; pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%);
      transition: left 0.09s ease, top 0.09s ease, width 0.2s, height 0.2s, border-color 0.2s;
    }

    /* ======== HERO ======== */
    #hero {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10; pointer-events: none; text-align: center;
    }

    .hero-name {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.2rem, 7vw, 6.5rem);
      font-weight: 900; letter-spacing: 0.16em; color: #fff;
      text-shadow:
        0 0 18px var(--cyan), 0 0 40px var(--cyan),
        0 0 80px rgba(0,245,255,0.35), 0 0 130px rgba(0,245,255,0.15);
      line-height: 1.1;
      animation: nameAppear 1.2s ease both, nameFlicker 9s ease-in-out 2.5s infinite;
    }
    @keyframes nameAppear {
      from { opacity:0; letter-spacing:0.5em; filter:blur(12px); }
      to   { opacity:1; letter-spacing:0.16em; filter:blur(0); }
    }
    @keyframes nameFlicker {
      0%,92%,100% { opacity:1; }
      93%  { opacity:0.72; }
      94%  { opacity:1; }
      95%  { opacity:0.82; }
      96%  { opacity:1; }
    }

    .hero-divider {
      width: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      margin: 1.1rem auto;
      animation: expandLine 1s ease 1.1s forwards;
    }
    @keyframes expandLine { to { width: clamp(160px, 26vw, 300px); } }

    .hero-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(0.85rem, 2.1vw, 1.4rem);
      color: var(--cyan); letter-spacing: 0.34em; text-transform: uppercase;
      animation: fadeInUp 1s ease 1.2s both;
    }
    .hero-subtitle {
      margin-top: 0.42rem;
      font-size: clamp(0.65rem, 1.3vw, 0.9rem);
      color: rgba(200,214,240,0.4); letter-spacing: 0.16em;
      animation: fadeInUp 1s ease 1.5s both;
    }
    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ======== FLOATING NAV BUTTONS ======== */
    #nav-buttons {
      position: fixed; bottom: 2.2rem;
      left: 0; right: 0;
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.9rem;
      z-index: 100; padding: 0 1rem;
      animation: fadeInUp 1s ease 2s both;
    }
    .nav-btn {
      position: relative;
      padding: 0.6rem 1.35rem;
      background: rgba(0,16,36,0.78);
      border: 1px solid rgba(0,245,255,0.26);
      color: var(--cyan);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
      cursor: none;
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
      backdrop-filter: blur(14px);
      overflow: hidden;
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.2s, color 0.2s;
    }
    .nav-btn::after {
      content: ''; position: absolute; top:0; left:-120%;
      width:100%; height:100%;
      background: linear-gradient(90deg, transparent, rgba(0,245,255,0.09), transparent);
      transition: left 0.4s ease;
    }
    .nav-btn:hover::after { left: 120%; }
    .nav-btn:hover {
      background: rgba(0,245,255,0.08);
      border-color: var(--cyan); color: #fff;
      box-shadow: 0 0 18px rgba(0,245,255,0.25), inset 0 0 10px rgba(0,245,255,0.04);
      transform: translateY(-3px);
    }
    .nav-btn.active {
      background: rgba(0,245,255,0.12);
      border-color: var(--cyan);
      box-shadow: 0 0 22px rgba(0,245,255,0.35);
    }
    .nav-btn i { margin-right: 0.42rem; font-size: 0.7rem; }

    /* ======== CARD OVERLAY ======== */
    #card-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(2,8,24,0.82); backdrop-filter: blur(7px);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    #card-overlay.open { opacity:1; pointer-events: all; }

    .card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid rgba(0,245,255,0.2);
      box-shadow: 0 0 60px rgba(0,245,255,0.07), inset 0 0 60px rgba(0,8,28,0.5);
      width: min(940px, 90vw); max-height: 78vh; overflow-y: auto; overflow-x: hidden;
      padding: 2.2rem 2.6rem;
      transform: scale(0.88) translateY(22px);
      transition: transform 0.38s cubic-bezier(0.34,1.56,0.64,1);
      scrollbar-width: thin; scrollbar-color: rgba(0,245,255,0.35) transparent;
    }
    #card-overlay.open .card { transform: scale(1) translateY(0); }
    .card::-webkit-scrollbar { width: 3px; }
    .card::-webkit-scrollbar-thumb { background: rgba(0,245,255,0.35); }

    /* card corner accents */
    .card::before {
      content:''; position:absolute; top:-1px; left:-1px;
      width:22px; height:22px;
      border-top:2px solid var(--cyan); border-left:2px solid var(--cyan);
    }
    .card::after {
      content:''; position:absolute; bottom:-1px; right:-1px;
      width:22px; height:22px;
      border-bottom:2px solid var(--cyan); border-right:2px solid var(--cyan);
    }

    .card-close {
      position: absolute; top:0.85rem; right:0.95rem;
      background: none; border:1px solid rgba(0,245,255,0.28);
      color: var(--cyan); font-size:1.1rem;
      width:30px; height:30px; display:flex; align-items:center; justify-content:center;
      cursor: none; transition: background 0.2s, box-shadow 0.2s;
    }
    .card-close:hover { background:rgba(0,245,255,0.1); box-shadow:0 0 10px rgba(0,245,255,0.4); }

    .card-title {
      font-family: 'Orbitron', sans-serif; font-size:1.2rem;
      color: var(--cyan); letter-spacing: 0.12em; margin-bottom:1.5rem;
      text-shadow: 0 0 10px rgba(0,245,255,0.4);
      border-bottom:1px solid rgba(0,245,255,0.16); padding-bottom:0.7rem;
    }

    /* ======== ABOUT CARD ======== */
    .about-grid {
      display: grid; grid-template-columns: auto 1fr;
      gap: 2rem; align-items: start;
    }
    .profile-icon {
      width:130px; height:130px; border-radius:50%;
      border:2px solid var(--cyan); box-shadow:0 0 20px rgba(0,245,255,0.25);
      display:flex; align-items:center; justify-content:center;
      font-size:2.6rem; color:var(--cyan); background:rgba(0,245,255,0.04);
      overflow:hidden; flex-shrink:0;
    }
    .profile-icon img {
      width:100%; height:100%; object-fit:cover; border-radius:50%;
    }
    .about-text p { line-height:1.85; color:var(--text); font-size:0.98rem; margin-bottom:0.85rem; }
    .about-text strong { color:var(--cyan); }
    .resume-link {
      display:inline-block; margin-top:0.3rem;
      padding:0.44rem 1.1rem;
      border:1px solid var(--cyan); color:var(--cyan);
      text-decoration:none; font-family:'Share Tech Mono',monospace; font-size:0.8rem;
      letter-spacing:0.08em;
      clip-path:polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
      transition:background 0.3s, box-shadow 0.3s, color 0.2s;
    }
    .resume-link:hover { background:rgba(0,245,255,0.09); box-shadow:0 0 14px rgba(0,245,255,0.28); color:#fff; }

    .skills-title {
      font-family:'Orbitron',sans-serif; font-size:0.8rem;
      color:var(--cyan); letter-spacing:0.12em; margin:1.8rem 0 0.95rem;
    }
    .skills-grid { display:flex; flex-direction:column; gap:0.7rem; }
    .skill-row { display:flex; gap:0.75rem; align-items:flex-start; flex-wrap:wrap; }
    .skill-label {
      font-family:'Share Tech Mono',monospace; font-size:0.72rem;
      color:var(--green); white-space:nowrap; min-width:144px; padding-top:3px;
    }
    .skill-tags { display:flex; flex-wrap:wrap; gap:0.35rem; }
    .skill-tag {
      padding:0.16rem 0.6rem;
      background:rgba(57,255,20,0.05); border:1px solid rgba(57,255,20,0.2);
      color:var(--text); font-size:0.76rem; font-family:'Rajdhani',sans-serif; border-radius:2px;
    }

    /* ======== TIMELINE ======== */
    .timeline { position:relative; padding-left:1.85rem; }
    .timeline::before {
      content:''; position:absolute; left:5px; top:4px; bottom:4px; width:2px;
      background:linear-gradient(to bottom, var(--cyan), var(--purple), var(--green));
    }
    .timeline-item { position:relative; margin-bottom:1.65rem; }
    .timeline-item::before {
      content:''; position:absolute; left:-1.6rem; top:5px;
      width:11px; height:11px; border-radius:50%;
      background:var(--cyan); box-shadow:0 0 8px var(--cyan);
    }
    .timeline-item.edu::before { background:var(--green); box-shadow:0 0 8px var(--green); }
    .timeline-role {
      font-family:'Orbitron',sans-serif; font-size:0.86rem; color:#fff; letter-spacing:0.04em;
    }
    .tl-badge {
      display:inline-block; font-size:0.6rem; padding:0.09rem 0.46rem;
      border-radius:2px; margin-left:0.42rem; vertical-align:middle;
      letter-spacing:0.05em; font-family:'Share Tech Mono',monospace;
    }
    .badge-work { background:rgba(0,245,255,0.07); border:1px solid rgba(0,245,255,0.25); color:var(--cyan); }
    .badge-edu  { background:rgba(57,255,20,0.07); border:1px solid rgba(57,255,20,0.25); color:var(--green); }
    .timeline-company {
      font-family:'Share Tech Mono',monospace; font-size:0.8rem;
      color:var(--cyan); margin:0.2rem 0;
    }
    .timeline-item.edu .timeline-company { color:var(--green); }
    .timeline-date { color:rgba(200,214,240,0.42); font-size:0.76rem; }

    /* ======== PROJECTS ======== */
    .projects-grid {
      display:grid; grid-template-columns:repeat(auto-fit, minmax(235px,1fr)); gap:1.05rem;
    }
    .project-card {
      background:rgba(0,16,42,0.6); border:1px solid rgba(0,245,255,0.13);
      padding:1.2rem; position:relative; overflow:hidden;
      transition:border-color 0.3s, box-shadow 0.3s, transform 0.25s;
    }
    .project-card::before {
      content:''; position:absolute; top:0; left:0;
      width:3px; height:100%;
      background:linear-gradient(to bottom, var(--cyan), var(--purple));
    }
    .project-card:hover {
      border-color:rgba(0,245,255,0.32); box-shadow:0 0 18px rgba(0,245,255,0.08); transform:translateY(-3px);
    }
    .project-name { font-family:'Orbitron',sans-serif; font-size:0.84rem; color:var(--cyan); margin-bottom:0.6rem; letter-spacing:0.05em; }
    .project-desc { color:var(--text); font-size:0.88rem; line-height:1.7; margin-bottom:0.85rem; }
    .project-stack { color:rgba(200,214,240,0.38); font-size:0.7rem; font-family:'Share Tech Mono',monospace; margin-bottom:0.75rem; }
    .project-link {
      display:inline-flex; align-items:center; gap:0.35rem;
      color:var(--green); text-decoration:none;
      font-family:'Share Tech Mono',monospace; font-size:0.74rem;
      letter-spacing:0.04em; transition:color 0.2s;
    }
    .project-link:hover { color:#fff; }

    /* ======== CONTACT ======== */
    .contact-grid { display:grid; grid-template-columns:1fr 1fr; gap:2rem; align-items:start; }
    .contact-subtitle { font-family:'Share Tech Mono',monospace; font-size:0.7rem; color:var(--cyan); letter-spacing:0.14em; margin-bottom:0.85rem; }
    .contact-item {
      display:flex; align-items:center; gap:1rem;
      padding:0.8rem 1rem;
      background:rgba(0,16,42,0.5); border:1px solid rgba(0,245,255,0.1);
      margin-bottom:0.7rem; transition:border-color 0.3s, box-shadow 0.3s;
    }
    .contact-item:hover { border-color:rgba(0,245,255,0.26); box-shadow:0 0 12px rgba(0,245,255,0.06); }
    .contact-icon { color:var(--cyan); font-size:1.1rem; width:22px; text-align:center; }
    .contact-text { font-family:'Rajdhani',sans-serif; font-size:0.98rem; color:var(--text); }
    .contact-text a { color:var(--cyan); text-decoration:none; }
    .contact-text a:hover { color:#fff; }
    .social-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:0.65rem; }
    .social-link {
      display:flex; align-items:center; gap:0.7rem;
      padding:0.7rem 0.95rem;
      background:rgba(0,16,42,0.5); border:1px solid rgba(0,245,255,0.1);
      color:var(--text); text-decoration:none;
      font-family:'Rajdhani',sans-serif; font-size:0.92rem;
      transition:background 0.3s, border-color 0.3s, color 0.2s, box-shadow 0.3s;
    }
    .social-link:hover {
      background:rgba(0,245,255,0.07); border-color:var(--cyan);
      color:var(--cyan); box-shadow:0 0 12px rgba(0,245,255,0.12);
    }
    .social-link i { font-size:1.05rem; width:17px; text-align:center; }

    /* ======== RESPONSIVE ======== */
    @media (max-width: 640px) {
      #nav-buttons { flex-wrap:wrap; justify-content:center; bottom:1.3rem; gap:0.55rem; }
      .nav-btn { padding:0.5rem 0.85rem; font-size:0.71rem; }
      .card { padding:1.3rem 1.1rem; }
      .about-grid { grid-template-columns:1fr; text-align:center; }
      .about-grid > div:first-child { display:flex; justify-content:center; }
      .contact-grid { grid-template-columns:1fr; }
    }
    @media (max-width: 480px) {
      .hero-name { letter-spacing: 0.08em; }
      #nav-buttons { gap: 0.4rem; }
      .nav-btn span { display: none; }
    }
  </style>
</head>
<body>

  <!-- ░░ SMOKE CANVAS ░░ -->
  <canvas id="smoke-canvas"></canvas>

  <!-- ░░ GRID OVERLAY ░░ -->
  <div class="grid-bg"></div>
  <div class="scanlines"></div>

  <!-- ░░ CORNER DECORATIONS ░░ -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- ░░ SYSTEM LABELS ░░ -->
  <span class="sys-label sys-label-left">SYS::PORTFOLIO_v2.0</span>
  <span class="sys-label sys-label-right">STATUS::ONLINE</span>

  <!-- ░░ CUSTOM CURSOR ░░ -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursor-ring"></div>

  <!-- ░░ HERO ░░ -->
  <div id="hero">
    <h1 class="hero-name">MALAV MISTRY</h1>
    <div class="hero-divider"></div>
    <div class="hero-title">Software Developer</div>
    <div class="hero-subtitle">C# &nbsp;&bull;&nbsp; .NET &nbsp;&bull;&nbsp; Angular &nbsp;&bull;&nbsp; Cloud &nbsp;&bull;&nbsp; Full-Stack</div>
  </div>

  <!-- ░░ FLOATING NAV BUTTONS ░░ -->
  <nav id="nav-buttons">
     <button class="nav-btn" data-card="about"><i class="fas fa-user"></i><span>Profile</span></button>
     <button class="nav-btn" data-card="experience"><i class="fas fa-briefcase"></i><span>Journey</span></button>
     <button class="nav-btn" data-card="projects"><i class="fas fa-code"></i><span>Builds</span></button>
     <button class="nav-btn" data-card="contact"><i class="fas fa-envelope"></i><span>Connect</span></button>
  </nav>

  <!-- ░░ CARD OVERLAY ░░ -->
  <div id="card-overlay">
    <div class="card" id="main-card">
      <button class="card-close" id="card-close" title="Close">&times;</button>
      <div id="card-content"></div>
    </div>
  </div>

  <!-- ████ CARD TEMPLATES ████ -->

  <!-- ABOUT -->
  <template id="tpl-about">
    <div class="card-title">// ABOUT_ME</div>
    <div class="about-grid">
      <div>
        <div class="profile-icon">
          <img src="img/profile.png" alt="Malav Mistry">
        </div>
      </div>
      <div class="about-text">
        <p>A seasoned software developer with <strong>8+ years</strong> of experience in backend and full-stack development, proficient in <strong>C#, .NET, Angular</strong>, and <strong>SQL</strong>.</p>
        <p>Strong understanding of Data Structures and Algorithms, with expertise in Web Technologies, API Development, cloud platforms (<strong>AWS, Azure</strong>), and performance optimization.</p>
        <p>Experienced in applying best practices such as <strong>Test-Driven Development (TDD)</strong>, CI/CD, and agile methodologies. Passionate about building scalable, secure software systems that drive innovation and support business growth.</p>
        <a href="document/RESUME.pdf" target="_blank" class="resume-link">
          <i class="fas fa-file-arrow-down" style="margin-right:0.4rem;"></i>VIEW RESUME
        </a>
      </div>
    </div>

    <div class="skills-title">// TECHNICAL_SKILLS</div>
    <div class="skills-grid">
      <div class="skill-row">
        <span class="skill-label">// Backend</span>
        <div class="skill-tags">
          <span class="skill-tag">C#</span><span class="skill-tag">.NET</span><span class="skill-tag">.NET Core</span>
          <span class="skill-tag">REST API</span><span class="skill-tag">PHP</span><span class="skill-tag">Python</span>
        </div>
      </div>
      <div class="skill-row">
        <span class="skill-label">// Frontend</span>
        <div class="skill-tags">
          <span class="skill-tag">Angular</span><span class="skill-tag">HTML5</span><span class="skill-tag">CSS3</span>
          <span class="skill-tag">JavaScript</span><span class="skill-tag">jQuery</span><span class="skill-tag">Blazor</span>
          <span class="skill-tag">Bootstrap</span><span class="skill-tag">ASP.NET MVC</span>
        </div>
      </div>
      <div class="skill-row">
        <span class="skill-label">// Database</span>

  <script>
    // ============================================
    //  SMOKE PARTICLE SYSTEM
    // ============================================
    const canvas = document.getElementById('smoke-canvas');
    const ctx    = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const SMOKE_COLORS = [
      '0,245,255',    // neon cyan
      '57,255,20',    // electric green
      '180,0,255',    // neon purple
      '65,105,225',   // electric blue
      '0,183,255',    // sky blue
    ];

    let mouseX = window.innerWidth  / 2;
    let mouseY = window.innerHeight / 2;
    let prevX  = mouseX, prevY = mouseY;
    let moving = false, moveTimer;
    const particles = [];

    class SmokeParticle {
      constructor(x, y) {
        this.x    = x + (Math.random() - 0.5) * 14;
        this.y    = y + (Math.random() - 0.5) * 14;
        this.r    = Math.random() * 18 + 6;
        this.maxR = this.r * (Math.random() * 3.2 + 2.4);
        this.rgb  = SMOKE_COLORS[Math.floor(Math.random() * SMOKE_COLORS.length)];
        this.alpha   = Math.random() * 0.32 + 0.1;
        this.vx      = (Math.random() - 0.5) * 1.5;
        this.vy      = (Math.random() - 0.5) * 1.5 - 0.65;
        this.life    = 0;
        this.maxLife = Math.random() * 55 + 38;
        this.rot     = Math.random() * Math.PI * 2;
        this.rotSpd  = (Math.random() - 0.5) * 0.042;
      }
      update() {
        this.life++;
        this.x  += this.vx; this.y  += this.vy;
        this.vx *= 0.977;   this.vy *= 0.977;
        this.r  += (this.maxR - this.r) * 0.055;
        this.alpha *= 0.963;
        this.rot += this.rotSpd;
        return this.life < this.maxLife && this.alpha > 0.004;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y); ctx.rotate(this.rot);
        const g = ctx.createRadialGradient(0,0,0, 0,0,this.r);
        g.addColorStop(0,   `rgba(${this.rgb},${this.alpha})`);
        g.addColorStop(0.4, `rgba(${this.rgb},${(this.alpha * 0.42).toFixed(3)})`);
        g.addColorStop(1,   `rgba(${this.rgb},0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }

    function spawnSmoke() {
      if (!moving) return;
      const dx = mouseX - prevX, dy = mouseY - prevY;
      const speed = Math.sqrt(dx*dx + dy*dy);
      const count = Math.min(Math.floor(speed * 0.3) + 1, 7);
      for (let i = 0; i < count; i++) particles.push(new SmokeParticle(mouseX, mouseY));
      prevX = mouseX; prevY = mouseY;
    }

    (function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      spawnSmoke();
      for (let i = particles.length - 1; i >= 0; i--) {
        if (!particles[i].update()) particles.splice(i, 1);
        else particles[i].draw();
      }
      requestAnimationFrame(renderLoop);
    })();

    // ============================================
    //  CUSTOM CURSOR
    // ============================================
    const cursorDot  = document.getElementById('cursor');
    const cursorRing = document.getElementById('cursor-ring');

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      moving = true;
      clearTimeout(moveTimer);
      moveTimer = setTimeout(() => { moving = false; }, 100);
      cursorDot.style.left  = mouseX + 'px';
      cursorDot.style.top   = mouseY + 'px';
      cursorRing.style.left = mouseX + 'px';
      cursorRing.style.top  = mouseY + 'px';
    });

    document.addEventListener('mouseover', (e) => {
      if (e.target.closest('button,a')) {
        cursorDot.style.transform  = 'translate(-50%,-50%) scale(2)';
        cursorRing.style.width     = '52px';
        cursorRing.style.height    = '52px';
        cursorRing.style.borderColor = 'rgba(0,245,255,0.9)';
      }
    });
    document.addEventListener('mouseout', (e) => {
      if (e.target.closest('button,a')) {
        cursorDot.style.transform  = 'translate(-50%,-50%) scale(1)';
        cursorRing.style.width     = '34px';
        cursorRing.style.height    = '34px';
        cursorRing.style.borderColor = 'rgba(0,245,255,0.5)';
      }
    });

    // ============================================
    //  CARD SYSTEM
    // ============================================
    const overlay     = document.getElementById('card-overlay');
    const cardClose   = document.getElementById('card-close');
    const cardContent = document.getElementById('card-content');

    const templates = {
      about:      document.getElementById('tpl-about'),
      experience: document.getElementById('tpl-experience'),
      projects:   document.getElementById('tpl-projects'),
      contact:    document.getElementById('tpl-contact'),
    };

    let activeBtn = null;

    function openCard(type) {
      const tpl = templates[type];
      if (!tpl) return;
      cardContent.innerHTML = '';
      cardContent.appendChild(tpl.content.cloneNode(true));
      // scroll to top
      document.getElementById('main-card').scrollTop = 0;
      overlay.classList.add('open');
      if (activeBtn) activeBtn.classList.remove('active');
      activeBtn = document.querySelector(`.nav-btn[data-card="${type}"]`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function closeCard() {
      overlay.classList.remove('open');
      if (activeBtn) { activeBtn.classList.remove('active'); activeBtn = null; }
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => openCard(btn.dataset.card));
    });

    cardClose.addEventListener('click', closeCard);

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeCard();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeCard();
    });
  </script>
